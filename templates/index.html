<!DOCTYPE html>
<html class="bg-[#05070a] text-white">
<head>
    <title>AI Sentinel Pro | Live Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex h-screen overflow-hidden">
    <!-- Sidebar: Live Accuracy Column -->
    <aside class="w-80 bg-[#0d1117] border-r border-gray-800 p-8 flex flex-col">
        <h1 class="text-2xl font-black text-blue-500 mb-8">VISION AI</h1>
        
        <div class="flex-1 overflow-hidden flex flex-col">
            <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-4">Live Detection Feed</h3>
            <div id="feed" class="flex-1 overflow-y-auto space-y-2 pr-2">
                <div class="text-gray-600 italic text-sm">Waiting for detections...</div>
            </div>
        </div>

        <!-- NEW: Surveillance Toggle Section -->
        <div class="mt-4 p-4 rounded-xl border border-gray-800 bg-[#0a0d12]">
            <label class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">System Mode</label>
            <button id="srvBtn" onclick="toggleSurveillance()" class="w-full mt-2 py-2 bg-gray-800 hover:bg-gray-700 rounded text-[11px] font-black transition tracking-tighter">
                🛡️ STANDARD MODE
            </button>
        </div>

        <button id="audioBtn" class="mt-4 w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-bold text-sm transition shadow-lg shadow-blue-900/20">
            🔔 ACTIVATE AUDIO ALERTS
        </button>
    </aside>

    <!-- Main Viewport -->
    <main class="flex-1 p-10 flex flex-col gap-6">
        <div class="flex justify-between items-center">
            <h2 class="text-xl font-bold">Real-Time Spatial Dashboard</h2>
            <div class="px-3 py-1 bg-green-900/20 border border-green-500/50 rounded-full text-[10px] text-green-400 font-bold">● ENGINE LIVE</div>
        </div>

        <!-- NEW: Active Counter Cards -->
        <div class="grid grid-cols-3 gap-4 mb-2">
            <div class="bg-[#0d1117] border border-gray-800 p-4 rounded-2xl shadow-sm">
                <label class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">Total Objects</label>
                <div id="totalCount" class="text-3xl font-black text-white">0</div>
            </div>
            <div class="bg-[#0d1117] border border-gray-800 p-4 rounded-2xl shadow-sm">
                <label class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">Persons</label>
                <div id="personCount" class="text-3xl font-black text-blue-500">0</div>
            </div>
            <div id="threatCard" class="bg-[#0d1117] border border-gray-800 p-4 rounded-2xl shadow-sm transition-all duration-300">
                <label class="text-[10px] text-gray-500 font-bold uppercase tracking-widest" id="threatLabel">Security Status</label>
                <div id="threatStatus" class="text-xl font-black text-gray-400 uppercase mt-1">Clear</div>
            </div>
        </div>

        <div class="aspect-video bg-black rounded-3xl border-2 border-gray-800 overflow-hidden shadow-2xl">
            <img src="/video_feed" class="w-full h-full object-cover">
        </div>
    </main>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let audioEnabled = false;
        let surveillanceActive = false;
        let beepInterval = null;

        document.getElementById('audioBtn').addEventListener('click', () => {
            audioCtx.resume();
            audioEnabled = true;
            document.getElementById('audioBtn').innerText = "✅ AUDIO ACTIVE";
            document.getElementById('audioBtn').classList.replace('bg-blue-600', 'bg-green-600');
        });

        async function toggleSurveillance() {
            const res = await fetch('/toggle_surveillance');
            const data = await res.json();
            surveillanceActive = data.status;
            
            const btn = document.getElementById('srvBtn');
            btn.innerText = surveillanceActive ? "🚨 SURVEILLANCE ACTIVE" : "🛡️ STANDARD MODE";
            btn.classList.toggle('bg-red-600', surveillanceActive);
            btn.classList.toggle('bg-gray-800', !surveillanceActive);

            // Reset threat card visually when toggling off
            if(!surveillanceActive) {
                document.getElementById('threatStatus').innerText = "Clear";
                document.getElementById('threatStatus').className = "text-xl font-black text-gray-400 uppercase mt-1";
                document.getElementById('threatCard').className = "bg-[#0d1117] border border-gray-800 p-4 rounded-2xl shadow-sm";
            }
        }

        function playAlert() {
            if (!audioEnabled) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        setInterval(async () => {
            try {
                const res = await fetch('/api/detections');
                const data = await res.json();
                const feed = document.getElementById('feed');
                
                const personInFrame = data.some(obj => obj.label === "PERSON");

                // Update Dashboard Counters
                document.getElementById('totalCount').innerText = data.length;
                document.getElementById('personCount').innerText = data.filter(obj => obj.label === "PERSON").length;

                // Update Threat Status Logic
                const tStatus = document.getElementById('threatStatus');
                const tCard = document.getElementById('threatCard');
                if (surveillanceActive && personInFrame) {
                    tStatus.innerText = "Threat Detected";
                    tStatus.className = "text-xl font-black text-red-600 uppercase mt-1 animate-pulse";
                    tCard.className = "bg-red-900/10 border border-red-600 p-4 rounded-2xl shadow-lg shadow-red-900/20";
                } else if (surveillanceActive) {
                    tStatus.innerText = "Monitoring";
                    tStatus.className = "text-xl font-black text-yellow-500 uppercase mt-1";
                    tCard.className = "bg-yellow-900/10 border border-yellow-600 p-4 rounded-2xl";
                } else {
                    tStatus.innerText = "Standby";
                    tStatus.className = "text-xl font-black text-gray-400 uppercase mt-1";
                    tCard.className = "bg-[#0d1117] border border-gray-800 p-4 rounded-2xl";
                }

                if (data.length > 0) {
                    feed.innerHTML = '';
                    data.forEach(obj => {
                        const item = document.createElement('div');
                        item.className = "bg-[#161b22] border border-gray-800 p-3 rounded-xl flex justify-between items-center animate-pulse";
                        item.innerHTML = `
                            <span class="font-bold text-sm ${obj.label === 'PERSON' && surveillanceActive ? 'text-red-500' : 'text-blue-400'}">${obj.label.toUpperCase()}</span>
                            <span class="text-xs font-mono text-gray-400">${obj.accuracy}</span>
                        `;
                        feed.prepend(item);
                    });

                    if (surveillanceActive && personInFrame) {
                        if (!beepInterval) {
                            beepInterval = setInterval(playAlert, 400);
                        }
                    } else if (!surveillanceActive) {
                        playAlert();
                        clearInterval(beepInterval);
                        beepInterval = null;
                    } else {
                        clearInterval(beepInterval);
                        beepInterval = null;
                    }
                } else {
                    clearInterval(beepInterval);
                    beepInterval = null;
                }
            } catch (e) {}
        }, 1000);
    </script>
</body>
</html>
