<!DOCTYPE html>
<html class="bg-[#05070a] text-white">
<head>
    <title>Astica Vision AI | Enterprise Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(13, 17, 23, 0.8); backdrop-filter: blur(10px); border: 1px solid #30363d; }
        .terminal::-webkit-scrollbar { width: 4px; }
        .terminal::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden font-sans">
    <aside class="w-80 bg-[#0d1117] border-r border-gray-800 p-8 flex flex-col gap-8">
        <div>
            <h1 class="text-2xl font-black text-blue-500 tracking-tighter">ASTICA <span class="text-white">PRO</span></h1>
            <p class="text-[10px] text-gray-500 uppercase tracking-widest font-bold mt-1">Vision Intelligence Hub</p>
        </div>

        <div class="glass p-4 rounded-xl">
            <label class="text-[10px] text-gray-500 font-bold uppercase">Input Management</label>
            <select class="w-full bg-transparent text-sm mt-2 outline-none"><option>Live Webcam 01</option></select>
        </div>

        <div class="flex-1 flex flex-col min-h-0">
            <label class="text-[10px] text-gray-500 font-bold uppercase mb-2">Live Inference Log</label>
            <div id="log" class="flex-1 bg-black/50 rounded-lg p-3 font-mono text-[11px] text-green-400 overflow-y-auto terminal"></div>
        </div>

        <button onclick="location.href='/export'" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-bold text-sm transition">📂 EXPORT DATA (CSV)</button>
    </aside>

    <main class="flex-1 p-10 flex flex-col gap-6 overflow-y-auto">
        <div class="flex justify-between items-center">
            <h2 class="text-xl font-bold">Real-Time Spatial Analytics</h2>
            <div class="px-3 py-1 bg-green-900/20 border border-green-500/50 rounded-full text-[10px] text-green-400 font-bold">● ENGINE OPTIMAL</div>
        </div>

        <div class="aspect-video rounded-3xl border-2 border-gray-800 overflow-hidden shadow-2xl bg-black">
            <img src="/video_feed" class="w-full h-full object-cover">
        </div>

        <div class="grid grid-cols-3 gap-6">
            <div class="glass p-6 rounded-2xl text-center"><h3 id="count" class="text-4xl font-bold">0</h3><p class="text-xs text-gray-500 mt-1 uppercase">Active Objects</p></div>
            <div class="glass p-6 rounded-2xl text-center"><h3 class="text-4xl font-bold text-blue-500">YOLOv8</h3><p class="text-xs text-gray-500 mt-1 uppercase">Inference Engine</p></div>
            <div class="glass p-6 rounded-2xl text-center"><h3 class="text-4xl font-bold">25ms</h3><p class="text-xs text-gray-500 mt-1 uppercase">Avg Latency</p></div>
        </div>
    </main>

    <script>
        let lastLog = "";

    setInterval(async () => {
        try {
            const res = await fetch('/api/metadata');
            const data = await res.json();
            
            // Update the big counter
            document.getElementById('count').innerText = data.length;
            
            const logElement = document.getElementById('log');
            
            // Only add to log if the detection is NEW to prevent the "Wall of Text"
            if (data.length > 0) {
                let currentLogEntry = data.map(o => o.label).join(",");
                if (currentLogEntry !== lastLog) {
                    const d = document.createElement('div');
                    d.className = "border-b border-white/5 pb-1 mb-1 animate-pulse";
                    const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
                    
                    // Show only the top detection to keep it clean
                    d.innerHTML = `<span class="text-gray-600">[${time}]</span> <span class="text-blue-400 font-bold">${data[0].label}</span> <span class="text-white">${data[0].conf}</span>`;
                    
                    logElement.prepend(d);
                    lastLog = currentLogEntry;
                }
            } else {
                // If nothing is found, we don't spam the log
                lastLog = "";
            }
        } catch (e) { console.log("Stream sync error"); }
    }, 1000);
    </script>
</body>
</html>
